[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Basic security headers (T-0325). SAMEORIGIN, not DENY: the Firebase sign-in helper is
# proxied on our own domain (/__/auth/*) and runs in an iframe on our own pages.
# No payment=() in Permissions-Policy so a future Stripe/Apple Pay button isn't blocked.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Content policy in REPORT-ONLY mode (T-0634, Nov 19 2026): nothing is blocked yet;
    # browsers send violations to /api/csp-report (Netlify function log). Enforce later by
    # renaming the header to Content-Security-Policy once the log stays clean.
    # Firebase Auth (redirect sign-in): apis.google.com script, identitytoolkit/securetoken
    # calls, and its helper iframe (our own /__/auth on the live site, firebaseapp.com on
    # previews). www.googleapis.com = YouTube import. img-src: any https image (Google
    # profile pictures, YouTube thumbnails). No inline scripts (scripts/csp-hash.mjs checks).
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src 'self' https://tunecraft-1aa7d.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-report"

# Firebase Auth handler proxy - keeps sign-in on our own domain (authDomain = tunecraft.music).
# Without this, signInWithRedirect breaks in Chrome/Safari/Firefox because the auth helper
# on firebaseapp.com is third-party and its storage is partitioned (user returns signed out).
# Must stay above the SPA fallback.
[[redirects]]
  from = "/__/auth/*"
  to = "https://tunecraft-1aa7d.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# SPA fallback, only for the app's own routes (src/router.js): the plain app shell.
# index.html is the prerendered landing page (scripts/prerender.mjs), which must not
# show up on /dashboard, /library, ... The public pages (/, /privacy, /terms, /blog,
# /blog/<slug>) are prerendered files and need no rule. Every other path gets
# dist/404.html with a real 404 status (Netlify serves it automatically), so search
# engines don't index junk URLs as copies of the app (T-0636, Nov 21 2026).
# A new app route needs a line here too, or a hard refresh on it shows a 404.
[[redirects]]
  from = "/dashboard"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/library"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/import"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/playlist/*"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/discover"
  to = "/app-shell.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/app-shell.html"
  status = 200
